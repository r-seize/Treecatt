[build-system]
requires            = ["setuptools>=61.0", "wheel"]
build-backend       = "setuptools.build_meta"

[project]
name                = "treecatt"
version             = "0.2.1"
description         = "A powerful tree visualization tool for directories"
readme              = "README.md"
requires-python     = ">=3.12"
license             = "BSD-3-Clause"
dependencies        = []
keywords            = ["tree", "cat", "file", "directory", "cli", "tool"]
classifiers         = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Environment :: Console",
]

[project.optional-dependencies]
dev = [
    "build>=1.3.0",
    "pytest>=9.0.2",
    "setuptools>=80.9.0",
    "stdeb>=0.11.0",
    "wheel>=0.45.1",
]

[project.scripts]
treecatt = "treecatt.main:main"

[project.urls]
Homepage    = "https://github.com/r-seize/TreeCatt"
Issues      = "https://github.com/r-seize/TreeCatt/issues"
Repository  = "https://github.com/r-seize/TreeCatt.git"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
